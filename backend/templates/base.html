<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HealthAnalytics IPS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .navbar-brand { font-weight: 600; }
    .sidebar-link.active { background-color: rgba(255,255,255,.15); border-radius: .375rem; }
    main { min-height: calc(100vh - 56px); }
    .kpi-card { border-left: 4px solid #0d6efd; }
    .kpi-card.critical { border-left-color: #dc3545; }
    .kpi-card.warning { border-left-color: #ffc107; }
    .kpi-card.success { border-left-color: #198754; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block navbar %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard/">
        <i class="bi bi-heart-pulse me-2"></i>HealthAnalytics IPS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/dashboard/' or request.path == '/api/dashboard/' %}active{% endif %}" href="/dashboard/">
              <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/patients' in request.path %}active{% endif %}" href="/patients/">
              <i class="bi bi-people me-1"></i>Pacientes
            </a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <span class="nav-link text-white-50">
              <i class="bi bi-person-circle me-1"></i>{{ request.user.username }}
            </span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/api/auth/logout/">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  {% endblock %}

  <main class="container-fluid py-4 px-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% load static %}
  <script src="{% static 'js/api.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
