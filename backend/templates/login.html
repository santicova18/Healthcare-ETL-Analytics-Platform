<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — HealthAnalytics IPS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .login-card { max-width: 420px; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col login-card">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-heart-pulse text-primary" style="font-size: 2.5rem;"></i>
              <h2 class="h4 mt-2 mb-0">HealthAnalytics IPS</h2>
              <p class="text-muted small">Panel clínico</p>
            </div>

            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
              {% csrf_token %}
              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                <span id="loginBtnText">Entrar</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  {% load static %}
  <script src="{% static 'js/api.js' %}"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');
      const errBox = document.getElementById('loginError');

      errBox.classList.add('d-none');
      btn.disabled = true;
      spinner.classList.remove('d-none');
      btnText.textContent = 'Ingresando...';

      try {
        const form = e.target;
        const body = new FormData(form);
        const res = await fetch('/api/auth/login/', {
          method: 'POST',
          body,
          credentials: 'include',
          redirect: 'follow',
        });

        const finalUrl = res.url || '';
        if (res.ok && (finalUrl.includes('/dashboard') || res.redirected)) {
          window.location.href = '/dashboard/';
          return;
        }

        const html = await res.text();
        if (html.includes('Credenciales inválidas') || html.includes('error')) {
          errBox.textContent = 'Credenciales inválidas. Intente de nuevo.';
          errBox.classList.remove('d-none');
        } else if (res.ok) {
          window.location.href = '/dashboard/';
        } else {
          errBox.textContent = 'Error al iniciar sesión. Intente de nuevo.';
          errBox.classList.remove('d-none');
        }
      } catch (err) {
        errBox.textContent = 'Error de conexión: ' + err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        btnText.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
